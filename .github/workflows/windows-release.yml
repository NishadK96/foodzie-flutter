name: Windows release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Verify source
        run: |
          flutter analyze
          flutter test
      - name: Build Windows release
        run: flutter build windows --release --dart-define=FOODZY_API_BASE_URL=https://foodzy.cloud/api/v1
      - name: Upload Windows application
        uses: actions/upload-artifact@v4
        with:
          name: Foodzy-Windows
          path: build/windows/x64/runner/Release/
          if-no-files-found: error
          retention-days: 14
